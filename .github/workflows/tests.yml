name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # The connector targets Windows. Bambu Studio is not installed on the runner,
    # so the integration tests that slice real models are skipped.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pyflakes bambu_mcp tests
      - run: python -m pytest tests -q
